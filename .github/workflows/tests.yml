name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # pfSense CE 2.8.x ships PHP 8.3; the neighbours catch upcoming breakage.
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium, intl, mbstring
          coverage: none
      - name: Run all tests
        # As root, so the full-disk test can mount its tmpfs.
        run: sudo env PATH="$PATH" PHP="$(command -v php)" sh tests/run_all.sh
