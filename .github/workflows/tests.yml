name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # pfSense CE 2.8.x ships PHP 8.3; the neighbours catch upcoming breakage.
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium, intl, mbstring
          coverage: none
      - name: Run all tests
        # As root, so the full-disk test can mount its tmpfs.
        run: sudo env PATH="$PATH" PHP="$(command -v php)" sh tests/run_all.sh
