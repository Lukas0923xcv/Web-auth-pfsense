name: release

# Pushing a tag vX.Y.Z publishes a GitHub Release with the tarball the
# README install command downloads, its SHA256SUMS and a build provenance
# attestation. The tag goes on the commit that pins the README (see
# docs/RELEASING.md): the release is that pinned code, checked byte for byte.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Check the tag, the README pin and the tarball
        id: pin
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [ "$(cat src/usr/local/pkg/webauthn/VERSION)" = "$version" ] ||
            { echo "::error::VERSION is $(cat src/usr/local/pkg/webauthn/VERSION), the tag is $tag"; exit 1; }
          sh tools/check_pin.sh
          commit=$(grep -oE 'tar\.gz/[0-9a-f]{40}' README.md | head -n 1 | sed 's#.*/##')
          hash=$(grep -oE 'sha256 -c [0-9a-f]{64}' README.md | head -n 1 | sed 's#.* ##')
          # The tag may add only the README pin on top of the pinned code.
          git diff --quiet "$commit" HEAD -- src install.sh uninstall.sh ||
            { echo "::error::the installed files differ between the pinned commit $commit and $tag"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Build the release files
        run: |
          set -eu
          mkdir dist
          name="web-auth-pfsense-${{ steps.pin.outputs.version }}.tar.gz"
          curl -fsSL --retry 3 -o "dist/$name" \
            "https://codeload.github.com/Lukas0923xcv/web-auth-pfsense/tar.gz/${{ steps.pin.outputs.commit }}"
          (cd dist && sha256sum "$name" > SHA256SUMS && cat SHA256SUMS)
          [ "$(cut -d' ' -f1 dist/SHA256SUMS)" = "${{ steps.pin.outputs.hash }}" ]
          # Release notes: this version's CHANGELOG section.
          awk -v v="${{ steps.pin.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > dist/notes.md
          {
            echo
            echo "Install or update (on the pfSense, as one line):"
            echo
            echo '```sh'
            grep -m 1 '^cd /root && fetch' README.md
            echo '```'
          } >> dist/notes.md

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/web-auth-pfsense-*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/notes.md \
            dist/web-auth-pfsense-*.tar.gz dist/SHA256SUMS
